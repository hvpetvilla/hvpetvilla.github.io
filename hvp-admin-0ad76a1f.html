<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>HV Petvilla — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:       #8A5A34;
    --teal-dark:  #3D2817;
    --teal-light: #EDE0CB;
    --green:      #C89B5C;
    --white:      #FBF6EC;
    --ink:        #3A2A1C;
    --surface:    #FFFBF3;
    --bg:         #F6EFE0;
    --border:     #E4D5BC;
    --muted:      #8A7860;
    --shadow-md:  0 4px 18px rgba(58,42,28,.12);
    --radius:     16px;
    --radius-sm:  10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .hub {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 40px 36px; width: 100%; max-width: 380px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 900; font-size: 1.3rem;
    color: var(--teal); margin-bottom: 4px;
  }
  .sub { font-size: .85rem; color: var(--muted); margin-bottom: 28px; }
  .link-card {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 16px 18px; margin-bottom: 14px; transition: border-color .15s, transform .15s;
  }
  .link-card:hover { border-color: var(--teal); transform: translateY(-2px); }
  .link-card .icon { font-size: 1.4rem; margin-bottom: 6px; display: block; }
  .link-card .name { font-weight: 700; font-size: .95rem; color: var(--teal); }
  .link-card .desc { font-size: .78rem; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="hub">
    <h1>🔒 Admin</h1>
    <div class="sub">Private links — not indexed or linked from the site.</div>

    <a class="link-card" href="shop.html">
      <span class="icon">🛍️</span>
      <div class="name">Shop Admin</div>
      <div class="desc">Manage storefront products &amp; reviews — click ⚙️ Admin on the shop page</div>
    </a>

    <a class="link-card" href="hvp-ops-5dd03707.html">
      <span class="icon">📊</span>
      <div class="name">Business Ops</div>
      <div class="desc">Invoices, expenses, vendors, catalogue &amp; more</div>
    </a>
  </div>
</body>
</html>
